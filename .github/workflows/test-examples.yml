name: Skill examples
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'asharehub>=0.10.0' pytest
      - run: python -m pytest -q tests
